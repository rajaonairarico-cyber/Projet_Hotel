<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Gestion d'Hôtel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #f7f1e7;          /* Fond beige crème */
      position: relative;
      overflow: hidden;
    }

    /* Halos ambre en arrière-plan */
    .halo { position: fixed; border-radius: 9999px; filter: blur(80px); pointer-events: none; }
    .halo-1 { width: 288px; height: 288px; background: rgba(254, 243, 199, 0.6); top: -80px; left: -80px; }
    .halo-2 { width: 384px; height: 384px; background: rgba(254, 230, 160, 0.4); bottom: 0; right: 0; }

    /* Carte principale */
    .card {
      position: relative;
      width: 100%;
      max-width: 448px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(78, 45, 12, 0.25);
      overflow: hidden;
    }

    /* Bandeau chocolat (ambre-950 → ambre-600) */
    .header {
      background: linear-gradient(90deg, #451a03 0%, #92400e 45%, #d97706 100%);
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      color: #fff;
      position: relative;
    }
    .header::before {
      content: "";
      position: absolute;
      top: 12px; left: 24px;
      width: 96px; height: 96px;
      background: rgba(255,255,255,0.10);
      border-radius: 9999px;
      filter: blur(24px);
    }
    .header::after {
      content: "";
      position: absolute;
      bottom: 8px; right: 16px;
      width: 64px; height: 64px;
      background: rgba(255,255,255,0.10);
      border-radius: 9999px;
      filter: blur(16px);
    }

    /* Logo (dégradé cacao #7b4a22 → #a56a33 → #d9a05b) */
    .logo {
      position: relative;
      width: 96px; height: 96px;
      margin: 0 auto;
      background: #fdf8ef;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 15px -3px rgba(78, 45, 12, 0.3);
      transform: rotate(3deg);
      transition: transform 0.3s ease;
    }
    .logo:hover { transform: rotate(0) scale(1.05); }
    .logo svg { width: 64px; height: 64px; }

    .header h1 {
      position: relative;
      margin-top: 1.25rem;
      font-size: 1.875rem;
      font-weight: 800;
      letter-spacing: 0.025em;
    }
    .header p {
      position: relative;
      margin-top: 0.25rem;
      font-size: 0.875rem;
      color: #fce7b3;   /* ambre-100 */
    }

    /* Corps de la carte */
    .body { padding: 2rem; }

    /* Message d'erreur */
    .error {
      display: none;
      margin-bottom: 1.25rem;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 0.65rem 1rem;
      font-size: 0.875rem;
    }
    .error.show { display: flex; align-items: center; gap: 0.5rem; }
    .error svg { width: 20px; height: 20px; flex-shrink: 0; }

    form { display: flex; flex-direction: column; gap: 1.25rem; }

    .field label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.375rem;
    }
    .field label span { color: #9ca3af; font-weight: 400; }

    .input-wrap { position: relative; }
    .input-wrap .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px; height: 20px;
      color: #9ca3af;
      pointer-events: none;
    }

    /* Champs : bordure/focus ambre, fond beige clair */
    input {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.75rem;
      border: 1px solid #fde68a;          /* ambre-200 */
      border-radius: 12px;
      background: rgba(254, 250, 240, 0.4); /* beige clair */
      font-size: 1rem;
      color: #1f2937;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    input::placeholder { color: #9ca3af; }
    input:hover { background: #ffffff; }
    input:focus {
      border-color: #d97706;              /* ambre-600 */
      box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.4);
      background: #fff;
    }

    /* Bouton « Ampidiro » : dégradé chocolat avec ombre assortie */
    button {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #92400e 0%, #d97706 100%); /* ambre-800 → ambre-600 */
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 10px 15px -3px rgba(146, 64, 14, 0.4);
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }
    button:hover {
      background: linear-gradient(90deg, #78350f 0%, #b45309 100%);
      transform: scale(1.02);
    }
    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.5);
    }

    .footer-note {
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: #9ca3af;
    }
    .footer-note svg { width: 16px; height: 16px; }

    .page-footer {
      text-align: center;
      color: #9ca3af;
      font-size: 0.75rem;
      margin-top: 1.25rem;
    }
    .page-footer strong { color: #92400e; }
  </style>
</head>
<body>
  <div class="halo halo-1"></div>
  <div class="halo halo-2"></div>

  <div class="card">
    <!-- Bandeau chocolat -->
    <div class="header">
      <!-- Logo cacao -->
      <div class="logo">
        <svg viewBox="0 0 64 64" fill="none">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="64" y2="64">
              <stop offset="0%" stop-color="#7b4a22"/>
              <stop offset="55%" stop-color="#a56a33"/>
              <stop offset="100%" stop-color="#d9a05b"/>
            </linearGradient>
          </defs>
          <!-- toque/graduation : bonnet de diplômé -->
          <path d="M8 28 32 16l24 12-24 12L8 28z" fill="url(#lg)"/>
          <path d="M18 34v10c0 4.4 6.3 8 14 8s14-3.6 14-8V34" stroke="url(#lg)" stroke-width="3" fill="none"/>
          <path d="M56 28v12" stroke="url(#lg)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="56" cy="44" r="3.5" fill="#a56a33"/>
          <!-- frange de la toque -->
          <path d="M30 16.5v-3M34 17.6v-3M26 17.6v-3" stroke="#7b4a22" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>Tongasoa</h1>
      <p>Gestion d'Hôtel</p>
    </div>

    <!-- Corps -->
    <div class="body">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="error show" id="erreur">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M12 8v4M12 16h.01"></path>
            </svg>
            <span id="erreurMsg">{{ messages[0] }}</span>
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST" novalidate>
        <!-- Identifiant -->
        <div class="field">
          <label for="username"></label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"></path>
            </svg>
            <input type="text" id="username" name="username" placeholder="Anarana" autocomplete="username" required />
          </div>
        </div>

        <!-- Mot de passe -->
        <div class="field">
          <label for="password"></label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="4" y="11" width="16" height="10" rx="2"></rect>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
            </svg>
            <input type="password" id="password" name="password" placeholder="Tarehimarika miafina" autocomplete="current-password" required />
          </div>
        </div>

        <!-- Bouton -->
        <button type="submit">Ampidiro</button>
      </form>

      <div class="footer-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="4" y="11" width="16" height="8" rx="2"></rect>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
        </svg>
        Compte : <strong>admin</strong> / <strong>admin123</strong>
      </div>
    </div>
  </div>
</body>
</html>
